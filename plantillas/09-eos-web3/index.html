<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EOS — Web3 at the Speed of Experience</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + Babel (CDN — same convention as plantillas 01-08) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- Fontshare: General Sans -->
  <link
    href="https://api.fontshare.com/v2/css?f[]=general-sans@200,300,400,500,600,700&display=swap"
    rel="stylesheet"
  />

  <style>
    *, html, body { font-family: 'General Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    html, body { background: #000; color: #fff; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useRef } = React;

    const VIDEO_SRC = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260217_030345_246c0224-10a4-422c-b324-070b7c0eceda.mp4';

    const NAV_LINKS = ['Get Started', 'Developers', 'Features', 'Resources'];

    // ───── Chevron-down icon ─────
    function ChevronDown({ size = 14 }) {
      return (
        <svg
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <polyline points="6 9 12 15 18 9" />
        </svg>
      );
    }

    // ───── Logo wordmark (placeholder) ─────
    function Logo() {
      return (
        <div
          style={{
            width: 187,
            height: 25,
            display: 'flex',
            alignItems: 'center',
            color: '#ffffff',
            fontWeight: 700,
            letterSpacing: '0.04em',
            fontSize: 20,
          }}
        >
          LOGOIPSUM
        </div>
      );
    }

    // ───── Pill button (layered construction) ─────
    // variant: 'dark'  → black inner bg, white text
    //          'light' → white inner bg, black text
    function PillButton({ children, variant = 'dark', as = 'button', href }) {
      const isLight = variant === 'light';
      const innerBg = isLight ? '#ffffff' : '#000000';
      const textCol = isLight ? '#000000' : '#ffffff';

      const Tag = as;
      const tagProps = as === 'a' ? { href: href || '#' } : { type: 'button' };

      return (
        <Tag
          {...tagProps}
          style={{
            position: 'relative',
            display: 'inline-block',
            borderRadius: 9999,
            padding: '0.6px',
            border: '0.6px solid rgba(255,255,255,1)',
            background: 'transparent',
            cursor: 'pointer',
            overflow: 'visible',
          }}
        >
          <span
            style={{
              position: 'relative',
              display: 'inline-block',
              borderRadius: 9999,
              background: innerBg,
              padding: '11px 29px',
              color: textCol,
              fontSize: 14,
              fontWeight: 500,
              lineHeight: 1,
              overflow: 'hidden',
            }}
          >
            {/* White glow streak on top */}
            <span
              style={{
                position: 'absolute',
                top: -6,
                left: '15%',
                right: '15%',
                height: 16,
                background:
                  'linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0) 100%)',
                filter: 'blur(6px)',
                borderRadius: 9999,
                pointerEvents: 'none',
              }}
            />
            <span style={{ position: 'relative', zIndex: 1 }}>{children}</span>
          </span>
        </Tag>
      );
    }

    // ═════════════════════════ App ═════════════════════════
    function App() {
      const videoRef = useRef(null);

      // Best-effort autoplay on mount (some browsers need the muted attr at load time)
      useEffect(() => {
        const v = videoRef.current;
        if (v) v.play().catch(() => {});
      }, []);

      return (
        <section className="relative w-full min-h-screen overflow-hidden bg-black text-white">
          {/* Background video */}
          <video
            ref={videoRef}
            src={VIDEO_SRC}
            autoPlay
            muted
            loop
            playsInline
            preload="auto"
            className="absolute inset-0 w-full h-full object-cover"
            style={{ zIndex: 0 }}
          />

          {/* 50% black overlay */}
          <div className="absolute inset-0 bg-black/50" style={{ zIndex: 1 }} />

          {/* Foreground content */}
          <div className="relative z-10 flex flex-col min-h-screen">
            {/* Navbar */}
            <nav
              className="flex items-center justify-between"
              style={{ padding: '20px 120px' }}
            >
              {/* Left: logo + nav links */}
              <div className="flex items-center" style={{ gap: 30 }}>
                <Logo />
                <div className="hidden md:flex items-center" style={{ gap: 30 }}>
                  {NAV_LINKS.map((label) => (
                    <a
                      key={label}
                      href="#"
                      className="flex items-center text-white"
                      style={{ fontSize: 14, fontWeight: 500, gap: 14 }}
                    >
                      <span>{label}</span>
                      <ChevronDown size={14} />
                    </a>
                  ))}
                </div>
              </div>

              {/* Right: Join Waitlist (dark pill) */}
              <PillButton variant="dark">Join Waitlist</PillButton>
            </nav>

            {/* Hero content */}
            <div
              className="flex-1 flex flex-col items-center justify-start text-center px-6"
              style={{
                paddingTop: 'clamp(200px, 28vh, 280px)',
                paddingBottom: 102,
                gap: 40,
              }}
            >
              {/* Badge pill */}
              <div
                style={{
                  display: 'inline-flex',
                  alignItems: 'center',
                  gap: 8,
                  background: 'rgba(255,255,255,0.10)',
                  border: '1px solid rgba(255,255,255,0.20)',
                  borderRadius: 20,
                  padding: '6px 14px',
                  fontSize: 13,
                  fontWeight: 500,
                }}
              >
                <span
                  style={{
                    width: 4,
                    height: 4,
                    borderRadius: '50%',
                    background: '#ffffff',
                    display: 'inline-block',
                  }}
                />
                <span>
                  <span style={{ color: 'rgba(255,255,255,0.60)' }}>
                    Early access available from
                  </span>{' '}
                  <span style={{ color: '#ffffff' }}>May 1, 2026</span>
                </span>
              </div>

              {/* Heading with gradient fill */}
              <h1
                style={{
                  maxWidth: 613,
                  fontSize: 'clamp(36px, 6vw, 56px)',
                  fontWeight: 500,
                  lineHeight: 1.28,
                  background:
                    'linear-gradient(144.5deg, rgba(255,255,255,1) 28%, rgba(0,0,0,0) 115%)',
                  WebkitBackgroundClip: 'text',
                  backgroundClip: 'text',
                  WebkitTextFillColor: 'transparent',
                  color: 'transparent',
                  margin: 0,
                }}
              >
                Web3 at the Speed of Experience
              </h1>

              {/* Subtitle */}
              <p
                style={{
                  maxWidth: 680,
                  fontSize: 15,
                  fontWeight: 400,
                  color: 'rgba(255,255,255,0.70)',
                  marginTop: -16, // gap-40 minus 24 = 16 (subtitle below heading at 24px gap)
                }}
              >
                Powering seamless experiences and real-time connections, EOS is the base
                for creators who move with purpose, leveraging resilience, speed, and
                scale to shape the future.
              </p>

              {/* CTA */}
              <PillButton variant="light">Join Waitlist</PillButton>
            </div>
          </div>
        </section>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <style>
    /* Tighter nav padding on smaller screens */
    @media (max-width: 768px) {
      nav { padding: 16px 24px !important; }
    }
  </style>
</body>
</html>
