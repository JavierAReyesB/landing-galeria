<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PureFlow One — Clean Air, Clear Mind. Anywhere.</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + Babel (CDN — same convention as plantillas 01-04) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- Inter font (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    * { font-family: 'Inter', sans-serif; }
    html, body { background: #fff; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useRef, useState } = React;

    // ───── Constants ─────
    const SPOTLIGHT_R = 260;
    const GRID_CELL   = 48;

    const BG_IMAGE_1 = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260512_012043_9764f2d0-5c6e-4faa-94a6-a8253df08c5e.png&w=1280&q=85';
    const BG_IMAGE_2 = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260512_012949_6b24738e-6e5f-4b6f-93d7-5772f4d32285.png&w=1280&q=85';

    // ───── Lucide icons (inline, matching lucide-react paths exactly) ─────
    const lucideBase = {
      width: 24, height: 24, viewBox: '0 0 24 24',
      fill: 'none', stroke: 'currentColor',
      strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round',
    };

    function Play({ size = 24, className = '', ...rest }) {
      return (
        <svg {...lucideBase} width={size} height={size} className={className} {...rest}>
          <polygon points="6 3 20 12 6 21 6 3" />
        </svg>
      );
    }
    function Menu({ size = 24, className = '', ...rest }) {
      return (
        <svg {...lucideBase} width={size} height={size} className={className} {...rest}>
          <line x1="4" x2="20" y1="12" y2="12" />
          <line x1="4" x2="20" y1="6"  y2="6"  />
          <line x1="4" x2="20" y1="18" y2="18" />
        </svg>
      );
    }
    function XIcon({ size = 24, className = '', ...rest }) {
      return (
        <svg {...lucideBase} width={size} height={size} className={className} {...rest}>
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      );
    }

    // ───── Logo (inline SVG) ─────
    function Logo() {
      return (
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 256 256" fill="none">
          <path
            d="M 256 64 L 256 128 L 192.5 128 L 160 95 L 128 64 L 96 95 L 63.5 128 L 64 128 L 128 192 L 128 256 L 64.5 256 L 32 223 L 0 192 L 0 64 L 64 0 L 192 0 Z M 256 192 L 256 256 L 192.5 256 L 160 223 L 128 192 L 128 128 L 192 128 Z"
            fill="#111111"
          />
        </svg>
      );
    }

    // ───── Nav (top bar) ─────
    function Nav({ menuOpen, setMenuOpen }) {
      const inactiveItems = ['Real Stories', 'Science', 'Plans', 'Reach Us'];
      return (
        <nav className="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-5 sm:px-8 py-4 sm:py-5">
          <div className="flex items-center">
            <Logo />
          </div>

          {/* Desktop pill nav */}
          <div className="hidden md:flex absolute left-1/2 -translate-x-1/2 bg-gray-900 rounded-full px-2 py-1.5 items-center gap-1">
            <button className="bg-white text-gray-900 text-sm font-medium px-4 py-1.5 rounded-full">Device</button>
            {inactiveItems.map((l) => (
              <button
                key={l}
                className="text-gray-300 text-sm font-medium px-4 py-1.5 rounded-full hover:text-white transition-colors"
              >
                {l}
              </button>
            ))}
          </div>

          {/* Desktop CTA */}
          <button className="hidden md:flex bg-gray-900 text-white text-sm font-medium px-5 py-2 rounded-full items-center gap-2 hover:bg-gray-700 transition-colors">
            <span className="w-2 h-2 rounded-full bg-green-400 inline-block"></span>
            Reserve Yours
          </button>

          {/* Mobile hamburger */}
          <button
            onClick={() => setMenuOpen(!menuOpen)}
            className="md:hidden text-gray-900 p-1"
            aria-label={menuOpen ? 'Close menu' : 'Open menu'}
          >
            {menuOpen ? <XIcon size={22} /> : <Menu size={22} />}
          </button>
        </nav>
      );
    }

    // ───── Mobile dropdown ─────
    function MobileMenu({ onClose }) {
      const items = ['Device', 'Real Stories', 'Science', 'Plans', 'Reach Us'];
      return (
        <div className="fixed top-0 left-0 right-0 z-40 bg-white pt-16 pb-6 px-5 shadow-lg flex flex-col gap-1 md:hidden">
          {items.map((l) => (
            <button
              key={l}
              className="text-gray-800 text-base font-medium py-3 border-b border-gray-100 text-left hover:text-gray-500 transition-colors"
              onClick={onClose}
            >
              {l}
            </button>
          ))}
          <button className="mt-4 bg-gray-900 text-white text-sm font-medium px-5 py-3 rounded-full flex items-center gap-2 justify-center hover:bg-gray-700 transition-colors">
            <span className="w-2 h-2 rounded-full bg-green-400 inline-block"></span>
            Reserve Yours
          </button>
        </div>
      );
    }

    // ───── Reveal layer (canvas radial mask) ─────
    function RevealLayer({ cursorPos }) {
      const canvasRef = useRef(null);
      const maskRef = useRef(null);

      // Resize listener — keep canvas sized to viewport
      useEffect(() => {
        const onResize = () => {
          const c = canvasRef.current;
          if (!c) return;
          c.width = window.innerWidth;
          c.height = window.innerHeight;
        };
        onResize();
        window.addEventListener('resize', onResize);
        return () => window.removeEventListener('resize', onResize);
      }, []);

      // Runs on every render of RevealLayer — redraws canvas, refreshes mask
      useEffect(() => {
        const c = canvasRef.current;
        if (!c) return;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, c.width, c.height);

        const grad = ctx.createRadialGradient(
          cursorPos.x, cursorPos.y, 0,
          cursorPos.x, cursorPos.y, SPOTLIGHT_R
        );
        grad.addColorStop(0,    'rgba(255,255,255,1)');
        grad.addColorStop(0.4,  'rgba(255,255,255,1)');
        grad.addColorStop(0.6,  'rgba(255,255,255,0.75)');
        grad.addColorStop(0.75, 'rgba(255,255,255,0.4)');
        grad.addColorStop(0.88, 'rgba(255,255,255,0.12)');
        grad.addColorStop(1,    'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cursorPos.x, cursorPos.y, SPOTLIGHT_R, 0, Math.PI * 2);
        ctx.fill();

        const dataUrl = c.toDataURL();
        const m = maskRef.current;
        if (m) {
          m.style.webkitMaskImage = `url(${dataUrl})`;
          m.style.maskImage       = `url(${dataUrl})`;
          m.style.webkitMaskSize  = '100% 100%';
          m.style.maskSize        = '100% 100%';
          m.style.webkitMaskRepeat = 'no-repeat';
          m.style.maskRepeat       = 'no-repeat';
        }
      });

      return (
        <>
          <canvas ref={canvasRef} style={{ display: 'none' }} />
          <div
            ref={maskRef}
            className="absolute inset-0 bg-center bg-cover bg-no-repeat z-30 pointer-events-none"
            style={{
              backgroundImage: `url('${BG_IMAGE_2}')`,
              width: '100%',
              height: '100%',
            }}
          />
        </>
      );
    }

    // ───── Hero section ─────
    function HeroSection() {
      const sectionRef    = useRef(null);
      const mouseRef      = useRef({ x: 0, y: 0 });
      const smoothRef     = useRef({ x: 0, y: 0 });
      const gridOffsetRef = useRef({ x: 0, y: 0 });
      const patternRef    = useRef(null);
      const [cursorPos, setCursorPos] = useState({ x: 0, y: 0 });

      useEffect(() => {
        const onMove = (e) => {
          mouseRef.current.x = e.clientX;
          mouseRef.current.y = e.clientY;
        };
        window.addEventListener('mousemove', onMove);

        let raf;
        const tick = () => {
          // Ease smooth toward mouse (0.1)
          smoothRef.current.x += (mouseRef.current.x - smoothRef.current.x) * 0.1;
          smoothRef.current.y += (mouseRef.current.y - smoothRef.current.y) * 0.1;

          const section = sectionRef.current;
          if (section) {
            const rect = section.getBoundingClientRect();
            const cx = (smoothRef.current.x - rect.left) / rect.width  - 0.5;
            const cy = (smoothRef.current.y - rect.top)  / rect.height - 0.5;

            gridOffsetRef.current.x += (cx * 16 - gridOffsetRef.current.x) * 0.06;
            gridOffsetRef.current.y += (cy * 16 - gridOffsetRef.current.y) * 0.06;

            // patternRef may not bind cleanly on every browser for SVG <pattern>
            // inside <defs>, so we resolve lazily and cache for subsequent frames.
            const pat = patternRef.current || document.getElementById('grid');
            if (pat) {
              if (!patternRef.current) patternRef.current = pat;
              pat.setAttribute('x', String(gridOffsetRef.current.x));
              pat.setAttribute('y', String(gridOffsetRef.current.y));
            }
          }

          setCursorPos({ x: smoothRef.current.x, y: smoothRef.current.y });
          raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);

        return () => {
          window.removeEventListener('mousemove', onMove);
          cancelAnimationFrame(raf);
        };
      }, []);

      return (
        <section
          ref={sectionRef}
          className="relative w-full overflow-hidden"
          style={{ height: '100vh' }}
        >
          {/* 1. Grid background SVG */}
          <svg
            className="absolute inset-0 w-full h-full pointer-events-none z-0"
            style={{ opacity: 0.1 }}
          >
            <defs>
              <pattern
                ref={patternRef}
                id="grid"
                width={GRID_CELL}
                height={GRID_CELL}
                patternUnits="userSpaceOnUse"
              >
                <path
                  d="M 48 0 L 0 0 0 48"
                  fill="none"
                  stroke="#64748b"
                  strokeWidth="0.6"
                />
              </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#grid)" />
          </svg>

          {/* 2. BG_IMAGE_1 base layer */}
          <div
            className="absolute inset-0 bg-center bg-cover bg-no-repeat z-10"
            style={{ backgroundImage: `url('${BG_IMAGE_1}')` }}
          />

          {/* 3. Reveal layer (BG_IMAGE_2 masked by canvas spotlight) */}
          <RevealLayer cursorPos={cursorPos} />

          {/* 4. Hero text block */}
          <div className="absolute bottom-12 sm:bottom-12 md:bottom-56 left-5 sm:left-8 md:left-12 max-w-[260px] sm:max-w-xs z-50">
            <p className="text-[10px] sm:text-[11px] font-semibold tracking-[0.18em] text-gray-600 uppercase mb-2 sm:mb-3">
              PureFlow One
            </p>
            <h1 className="text-2xl sm:text-3xl md:text-4xl font-bold text-gray-900 leading-tight mb-4 sm:mb-6">
              Clean Air, Clear<br />Mind. Anywhere.
            </h1>
            <div className="flex items-center gap-3 sm:gap-4">
              <button className="bg-gray-900 text-white text-xs sm:text-sm font-medium px-4 sm:px-6 py-2 sm:py-2.5 rounded-full hover:bg-gray-700 transition-colors">
                Discover
              </button>
              <button className="flex items-center gap-2 text-gray-700 text-xs sm:text-sm font-medium hover:text-gray-900 transition-colors">
                <Play size={12} className="fill-gray-700" />
                View Specs
              </button>
            </div>
          </div>
        </section>
      );
    }

    // ═════════════════════════ App ═════════════════════════
    function App() {
      const [menuOpen, setMenuOpen] = useState(false);
      return (
        <div className="min-h-screen bg-white" style={{ fontFamily: 'Inter, sans-serif' }}>
          <Nav menuOpen={menuOpen} setMenuOpen={setMenuOpen} />
          {menuOpen && <MobileMenu onClose={() => setMenuOpen(false)} />}
          <HeroSection />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
