<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyElite — Premium. Accessible. Private jets.</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + Babel (CDN — same convention as plantillas 01-16) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    html, body { background: #f9fafb; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useRef, useState } = React;

    const VIDEO_SRC = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_091828_e240eb17-6edc-4129-ad9d-98678e3fd238.mp4';
    const NAV_ITEMS = ['Start', 'Story', 'Rates', 'Benefits', 'FAQ'];

    // ───── Lucide icons (inline) ─────
    const lucideBase = {
      viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor',
      strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round',
    };
    function Menu({ size = 24, className = '' }) {
      return (
        <svg {...lucideBase} width={size} height={size} className={className}>
          <line x1="4" x2="20" y1="12" y2="12" />
          <line x1="4" x2="20" y1="6"  y2="6"  />
          <line x1="4" x2="20" y1="18" y2="18" />
        </svg>
      );
    }
    function XIcon({ size = 24, className = '' }) {
      return (
        <svg {...lucideBase} width={size} height={size} className={className}>
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      );
    }

    // ═════════════════════════ App ═════════════════════════
    function App() {
      const [menuOpen, setMenuOpen] = useState(false);
      const videoRef = useRef(null);

      useEffect(() => {
        const v = videoRef.current;
        if (v) v.play().catch(() => {});
      }, []);

      return (
        <div className="min-h-screen bg-gray-50">
          <section className="relative h-screen overflow-hidden">
            {/* Background video */}
            <video
              ref={videoRef}
              src={VIDEO_SRC}
              autoPlay
              muted
              loop
              playsInline
              preload="auto"
              className="absolute inset-0 w-full h-full object-cover"
              style={{ zIndex: 0 }}
            />

            {/* Content wrapper */}
            <div className="relative z-10 h-full flex flex-col">
              {/* Navbar */}
              <nav className="w-full max-w-7xl mx-auto px-8 py-6 flex items-center justify-between">
                <span className="text-2xl font-semibold text-gray-900">SkyElite</span>

                {/* Desktop menu */}
                <ul className="hidden md:flex items-center gap-8">
                  {NAV_ITEMS.map((item) => (
                    <li key={item}>
                      <a
                        href="#"
                        className="text-gray-900 hover:text-gray-700 transition-colors"
                      >
                        {item}
                      </a>
                    </li>
                  ))}
                </ul>

                {/* Mobile hamburger */}
                <button
                  onClick={() => setMenuOpen((v) => !v)}
                  className="md:hidden text-gray-900"
                  aria-label="Toggle menu"
                >
                  {menuOpen ? <XIcon size={24} /> : <Menu size={24} />}
                </button>
              </nav>

              {/* Mobile menu dropdown */}
              {menuOpen && (
                <div className="md:hidden mx-8 -mt-2 rounded-2xl bg-white/95 backdrop-blur shadow-lg p-6">
                  <ul className="flex flex-col gap-4">
                    {NAV_ITEMS.map((item) => (
                      <li key={item}>
                        <a
                          href="#"
                          onClick={() => setMenuOpen(false)}
                          className="text-gray-900 hover:text-gray-700 transition-colors"
                        >
                          {item}
                        </a>
                      </li>
                    ))}
                  </ul>
                </div>
              )}

              {/* Main content */}
              <div className="flex-1 flex items-center justify-center px-6">
                <div className="text-center -mt-80">
                  <p className="text-sm font-semibold text-gray-600 tracking-wider mb-4">
                    PRIVATE JETS
                  </p>

                  <h1 className="text-6xl md:text-7xl lg:text-8xl font-normal leading-none tracking-tighter">
                    <span className="block text-gray-500">Premium.</span>
                    <span
                      className="block"
                      style={{ color: '#202A36', marginTop: -12 }}
                    >
                      Accessible.
                    </span>
                  </h1>

                  <p className="text-lg md:text-xl text-gray-600 mb-6 max-w-2xl mx-auto mt-6">
                    Your dedication deserves recognition.
                  </p>

                  <div className="flex items-center justify-center gap-4">
                    <button
                      className="px-4 py-2 rounded-full bg-gray-300 text-gray-800 font-medium hover:bg-gray-400 transition-colors"
                    >
                      Discover
                    </button>
                    <button
                      className="px-4 py-2 rounded-full text-white font-medium transition-colors"
                      style={{ backgroundColor: '#202A36' }}
                      onMouseEnter={(e) => { e.currentTarget.style.backgroundColor = '#1a2229'; }}
                      onMouseLeave={(e) => { e.currentTarget.style.backgroundColor = '#202A36'; }}
                    >
                      Book Now
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
