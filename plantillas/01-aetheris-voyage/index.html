  <script type="text/babel">
    const { useEffect, useRef } = React;

    const FADE_MS = 500;
    const FADE_OUT_LEAD = 0.55;

    function FadingVideo({ src, className, style }) {
      const videoRef = useRef(null);
      const rafRef = useRef(null);
      const fadingOutRef = useRef(false);

      const fadeTo = (target, duration) => {
        const v = videoRef.current;
        if (!v) return;
        if (rafRef.current) cancelAnimationFrame(rafRef.current);

        const start = parseFloat(v.style.opacity || "0");
        const startTime = performance.now();

        const step = (now) => {
          const t = Math.min(1, (now - startTime) / duration);
          const value = start + (target - start) * t;
          v.style.opacity = String(value);
          if (t < 1) {
            rafRef.current = requestAnimationFrame(step);
          } else {
            rafRef.current = null;
          }
        };
        rafRef.current = requestAnimationFrame(step);
      };

      useEffect(() => {
        const v = videoRef.current;
        if (!v) return;

        v.style.opacity = "0";

        const onLoadedData = () => {
          v.style.opacity = "0";
          v.play().catch(() => {});
          fadeTo(1, FADE_MS);
        };

        const onTimeUpdate = () => {
          if (fadingOutRef.current) return;
          const remaining = v.duration - v.currentTime;
          if (!isFinite(remaining)) return;
          if (remaining <= FADE_OUT_LEAD && remaining > 0) {
            fadingOutRef.current = true;
            fadeTo(0, FADE_MS);
          }
        };

        const onEnded = () => {
          v.style.opacity = "0";
          setTimeout(() => {
            v.currentTime = 0;
            v.play().catch(() => {});
            fadingOutRef.current = false;
            fadeTo(1, FADE_MS);
          }, 100);
        };

        v.addEventListener("loadeddata", onLoadedData);
        v.addEventListener("timeupdate", onTimeUpdate);
        v.addEventListener("ended", onEnded);

        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          v.removeEventListener("loadeddata", onLoadedData);
          v.removeEventListener("timeupdate", onTimeUpdate);
          v.removeEventListener("ended", onEnded);
        };
      }, [src]);

      return (
        <video
          ref={videoRef}
          src={src}
          autoPlay
          muted
          playsInline
          preload="auto"
          className={className}
          style={{ opacity: 0, ...style }}
        />
      );
    }

    window.FadingVideo = FadingVideo;
  </script>

  <script type="text/babel">
    const { useEffect: useEffectBT, useRef: useRefBT, useState: useStateBT } = React;
    const motion = window.Motion.motion;

    function BlurText({ text, className }) {
      const ref = useRefBT(null);
      const [visible, setVisible] = useStateBT(false);

      useEffectBT(() => {
        const el = ref.current;
        if (!el) return;
        const io = new IntersectionObserver(
          (entries) => {
            entries.forEach((e) => {
              if (e.isIntersecting) {
                setVisible(true);
                io.disconnect();
              }
            });
          },
          { threshold: 0.1 }
        );
        io.observe(el);
        return () => io.disconnect();
      }, []);

      const words = text.split(" ");

      return (
        <p
          ref={ref}
          className={className}
          style={{
            display: "flex",
            flexWrap: "wrap",
            justifyContent: "center",
            rowGap: "0.1em",
          }}
        >
          {words.map((word, i) => (
            <motion.span
              key={i}
              initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
              animate={
                visible
                  ? {
                      filter: ["blur(10px)", "blur(5px)", "blur(0px)"],
                      opacity: [0, 0.5, 1],
                      y: [50, -5, 0],
                    }
                  : {}
              }
              transition={{
                duration: 0.7,
                times: [0, 0.5, 1],
                ease: "easeOut",
                delay: (i * 100) / 1000,
              }}
              style={{ display: "inline-block", marginRight: "0.28em" }}
            >
              {word}
            </motion.span>
          ))}
        </p>
      );
    }

    window.BlurText = BlurText;
  </script>
