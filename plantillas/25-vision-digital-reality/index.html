<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Vision · Our Digital Reality</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + Babel (CDN — same convention as plantillas 01-24) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- Framer Motion -->
  <script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>

  <!-- hls.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15"></script>

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    html, body { background: #010101; color: #fff; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Infinite marquee keyframes */
    @keyframes infinite-slide {
      0%   { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    .animate-infinite-slide {
      animation: infinite-slide 30s linear infinite;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useRef } = React;

    const HLS_SRC = 'https://stream.mux.com/8wrHPCX2dC3msyYU9ObwqNdm00u3ViXvOSHUMRYSEe5Q.m3u8';

    // Brand logos
    const LOGOS = [
      'logos/openai.svg',
      'logos/nvidia.svg',
      'logos/github.svg',
      'logos/laravel.svg',
      'logos/lilly.svg',
      'logos/lemonsqueezy.svg',
      'logos/nike.svg',
      'logos/column.svg',
    ];

    // ───── Icons ─────
    function Zap({ size = 14 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor">
          <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" />
        </svg>
      );
    }
    function ArrowUpRight({ size = 14 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
             stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <path d="M7 7h10v10" />
          <path d="M7 17 17 7" />
        </svg>
      );
    }

    // ───── HLS video component ─────
    function HlsVideo({ src, className, style }) {
      const videoRef = useRef(null);
      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;
        const Hls = window.Hls;
        let hls = null;
        if (Hls && Hls.isSupported()) {
          hls = new Hls({ autoStartLoad: true });
          hls.loadSource(src);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
          // Fallback on irrecoverable error
          hls.on(Hls.Events.ERROR, (_, data) => {
            if (data.fatal) {
              hls.destroy();
              // Fallback: stop trying — browser shows nothing rather than glitch
            }
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = src;
          video.play().catch(() => {});
        }
        return () => { if (hls) hls.destroy(); };
      }, [src]);
      return (
        <video
          ref={videoRef}
          autoPlay muted loop playsInline preload="auto"
          className={className}
          style={style}
        />
      );
    }

    // ───── InfiniteSlider ─────
    function InfiniteSlider({ children, gap = 60 }) {
      // Children array doubled for seamless loop
      const items = React.Children.toArray(children);
      const doubled = [...items, ...items];
      return (
        <div className="overflow-hidden relative">
          <div
            className="flex animate-infinite-slide"
            style={{ gap: `${gap}px`, width: 'max-content' }}
          >
            {doubled.map((child, i) => (
              <div key={i} className="shrink-0 flex items-center justify-center">
                {child}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ═════════════════════════ Hero ═════════════════════════
    function Hero() {
      return (
        <section className="relative w-full overflow-hidden bg-[#010101]">
          <div className="relative z-20 flex flex-col items-center text-center px-6 pt-20 md:pt-28">
            {/* Announcement pill */}
            <div
              className="inline-flex items-center gap-2 pl-1 pr-4 py-1 rounded-full mb-8"
              style={{
                backgroundColor: 'rgba(28, 27, 36, 0.15)',
                border: '1px solid rgba(255,255,255,0.10)',
                backdropFilter: 'blur(8px)',
              }}
            >
              <span
                className="flex items-center justify-center w-6 h-6 rounded-full text-white"
                style={{
                  background: 'linear-gradient(135deg, #FA93FA 0%, #C967E8 50%, #983AD6 100%)',
                  boxShadow: '0 0 16px 2px rgba(201, 103, 232, 0.5)',
                }}
              >
                <Zap size={12} />
              </span>
              <span className="text-xs sm:text-sm text-white/80">
                Used by founders. Loved by devs.
              </span>
            </div>

            {/* H1 with gradient text */}
            <h1
              className="font-bold tracking-tight leading-[1.05] max-w-4xl"
              style={{
                fontSize: 'clamp(48px, 8vw, 80px)',
              }}
            >
              <span
                className="block"
                style={{
                  background:
                    'linear-gradient(135deg, #ffffff 0%, #ffffff 35%, #FA93FA 70%, #983AD6 100%)',
                  WebkitBackgroundClip: 'text',
                  backgroundClip: 'text',
                  WebkitTextFillColor: 'transparent',
                  color: 'transparent',
                }}
              >
                Your Vision
              </span>
              <span
                className="block"
                style={{
                  background:
                    'linear-gradient(135deg, #ffffff 0%, #ffffff 35%, #FA93FA 70%, #983AD6 100%)',
                  WebkitBackgroundClip: 'text',
                  backgroundClip: 'text',
                  WebkitTextFillColor: 'transparent',
                  color: 'transparent',
                }}
              >
                Our Digital Reality.
              </span>
            </h1>

            {/* Subheadline */}
            <p className="mt-6 text-base md:text-lg text-white/80 max-w-xl leading-relaxed">
              We turn bold ideas into modern designs that don't just look amazing, they
              grow your business fast.
            </p>

            {/* CTA */}
            <div
              className="mt-8 inline-block rounded-full p-1"
              style={{
                backgroundColor: 'rgba(255,255,255,0.05)',
                border: '1px solid rgba(255,255,255,0.10)',
                backdropFilter: 'blur(8px)',
              }}
            >
              <button
                className="inline-flex items-center gap-2 rounded-full bg-white text-black text-sm font-semibold pl-5 pr-1 py-1"
              >
                Book a 15-min call
                <span
                  className="flex items-center justify-center w-8 h-8 rounded-full text-white"
                  style={{
                    background:
                      'linear-gradient(135deg, #FA93FA 0%, #C967E8 50%, #983AD6 100%)',
                  }}
                >
                  <ArrowUpRight size={14} />
                </span>
              </button>
            </div>
          </div>

          {/* Hero video — overlaps text via negative margin */}
          <div
            className="relative w-full"
            style={{
              marginTop: '-150px',
              zIndex: 10,
            }}
          >
            <HlsVideo
              src={HLS_SRC}
              className="w-full h-auto block"
              style={{ mixBlendMode: 'screen' }}
            />
            {/* Gradient fade overlay */}
            <div
              className="absolute inset-0 pointer-events-none"
              style={{
                background:
                  'linear-gradient(to bottom, #010101, transparent, #010101)',
              }}
            />
          </div>
        </section>
      );
    }

    // ═════════════════════════ LogoCloud ═════════════════════════
    function LogoCloud() {
      return (
        <section
          className="relative w-full bg-black/20 backdrop-blur-sm py-12 md:py-16"
          style={{ borderTop: '1px solid rgba(255,255,255,0.05)' }}
        >
          <div className="max-w-7xl mx-auto px-6 flex flex-col md:flex-row items-center gap-8">
            {/* Left text */}
            <div className="shrink-0 flex items-center md:border-r md:border-white/10 md:pr-8">
              <p className="text-sm text-white/60 leading-tight">
                Powering the<br />best teams
              </p>
            </div>

            {/* Slider right */}
            <div className="flex-1 w-full overflow-hidden">
              <InfiniteSlider gap={60}>
                {LOGOS.map((src, i) => (
                  <img
                    key={i}
                    src={src}
                    alt=""
                    className="h-6 w-auto"
                    style={{ filter: 'brightness(0) invert(1)', opacity: 0.7 }}
                  />
                ))}
              </InfiniteSlider>
            </div>
          </div>
        </section>
      );
    }

    // ═════════════════════════ App ═════════════════════════
    function App() {
      return (
        <main className="bg-[#010101] min-h-screen">
          <Hero />
          <LogoCloud />
        </main>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
