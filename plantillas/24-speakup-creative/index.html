<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speakup</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + Babel (CDN — same convention as plantillas 01-23) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- Fonts: Recoleta (display) + Inter -->
  <link
    href="https://db.onlinewebfonts.com/c/67415ab41a7350f81536b69763e6d031?family=Recoleta+Regular"
    rel="stylesheet"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            recoleta: ['"Recoleta Regular"', 'serif'],
            inter:    ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              green: '#0E7824',
              dark:  '#2D2D2F',
            },
          },
        },
      },
    };
  </script>

  <style>
    html, body { background: #fff; color: #2D2D2F; }
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .font-recoleta { font-family: 'Recoleta Regular', serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const VIDEO_SRC = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260508_150921_27df94bd-d1e3-4440-9f55-314c4611902b.mp4';

    const NAV_LINKS = ['Projects', 'The Team', 'Products', 'Our Story', 'Say Hello!'];

    // ───── Lucide icons ─────
    const lucideBase = { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' };
    function MenuIcon({ size = 28 }) {
      return (
        <svg {...lucideBase} width={size} height={size}>
          <line x1="4" x2="20" y1="12" y2="12" />
          <line x1="4" x2="20" y1="6"  y2="6"  />
          <line x1="4" x2="20" y1="18" y2="18" />
        </svg>
      );
    }
    function XIcon({ size = 28 }) {
      return (
        <svg {...lucideBase} width={size} height={size}>
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      );
    }

    // ───── Logo SVG ─────
    function Logo({ className = '', color = '#2D2D2F' }) {
      return (
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" className={className}>
          <path
            fill={color}
            d="M 128.005 191.173 C 128.448 156.208 156.93 128 192 128 L 192 64 L 128 64 C 128 99.346 99.346 128 64 128 L 64 192 L 128 192 Z M 192 256 L 64 256 C 28.654 256 0 227.346 0 192 L 0 64 L 64 64 L 64 0 L 192 0 C 227.346 0 256 28.654 256 64 L 256 192 L 192 192 Z"
          />
        </svg>
      );
    }

    // ═════════════════════════ Hero ═════════════════════════
    function Hero() {
      const [menuOpen, setMenuOpen] = useState(false);

      return (
        <section
          className="relative w-full overflow-hidden"
          style={{ height: '100vh', minHeight: 600 }}
        >
          {/* Background video — no overlay */}
          <video
            src={VIDEO_SRC}
            autoPlay
            muted
            loop
            playsInline
            preload="auto"
            className="absolute inset-0 w-full h-full object-cover"
            style={{ zIndex: 0 }}
          />

          {/* Navbar */}
          <nav
            className="relative flex items-center justify-between px-6 md:px-12 lg:px-16 pt-6 md:pt-8"
            style={{ zIndex: 20 }}
          >
            {/* Left: Logo + wordmark */}
            <div className="flex items-center gap-2 text-brand-dark">
              <Logo className="w-8 h-8 md:w-9 md:h-9" color="#2D2D2F" />
              <span className="text-lg md:text-xl tracking-tight" style={{ color: '#2D2D2F' }}>
                <span className="font-bold">SPEAK</span>
                <span className="font-black">UP</span>
              </span>
            </div>

            {/* Center: links (desktop) */}
            <div className="hidden lg:flex items-center gap-8 xl:gap-10">
              {NAV_LINKS.map((l) => (
                <a
                  key={l}
                  href="#"
                  className="text-sm font-medium transition-colors hover:text-brand-green"
                  style={{ color: '#2D2D2F' }}
                  onMouseEnter={(e) => { e.currentTarget.style.color = '#0E7824'; }}
                  onMouseLeave={(e) => { e.currentTarget.style.color = '#2D2D2F'; }}
                >
                  {l}
                </a>
              ))}
            </div>

            {/* Right: CTA pill (desktop) */}
            <a
              href="#"
              className="hidden lg:inline-flex rounded-full text-white text-sm font-medium px-7 py-3.5 shadow-sm transition-colors"
              style={{ backgroundColor: '#2D2D2F' }}
              onMouseEnter={(e) => { e.currentTarget.style.backgroundColor = '#000'; }}
              onMouseLeave={(e) => { e.currentTarget.style.backgroundColor = '#2D2D2F'; }}
            >
              Begin a venture
            </a>

            {/* Mobile hamburger */}
            <button
              onClick={() => setMenuOpen(true)}
              className="lg:hidden text-brand-dark"
              style={{ color: '#2D2D2F' }}
              aria-label="Open menu"
            >
              <MenuIcon size={28} />
            </button>
          </nav>

          {/* Hero content */}
          <div
            className="relative px-6 md:px-12 lg:px-16 mt-8 md:mt-16 lg:mt-24 max-w-7xl"
            style={{ zIndex: 10 }}
          >
            <h1
              className="font-recoleta tracking-tight"
              style={{
                color: '#0E7824',
                lineHeight: 1.05,
                fontSize: 'clamp(56px, 13vw, 128px)',
              }}
            >
              Crafting the<br />improbable
            </h1>

            <p
              className="mt-6 md:mt-8 text-base md:text-lg max-w-md"
              style={{ color: '#2D2D2F', fontFamily: 'Inter, sans-serif', lineHeight: 1.5 }}
            >
              We bring your boldest digital visions to reality.
              <br className="hidden sm:block" />
              Because it cannot be done is where we all begin now
            </p>

            <a
              href="#"
              className="mt-8 md:mt-10 inline-flex rounded-full text-white text-base font-medium px-10 py-4 shadow-md transition-colors"
              style={{ backgroundColor: '#2D2D2F' }}
              onMouseEnter={(e) => { e.currentTarget.style.backgroundColor = '#000'; }}
              onMouseLeave={(e) => { e.currentTarget.style.backgroundColor = '#2D2D2F'; }}
            >
              Begin a venture
            </a>
          </div>

          {/* Mobile menu overlay */}
          {menuOpen && (
            <div
              className="fixed inset-0 bg-white lg:hidden flex flex-col"
              style={{ zIndex: 50 }}
            >
              <div className="flex items-center justify-between px-6 pt-6">
                <div className="flex items-center gap-2">
                  <Logo className="w-9 h-9" color="#2D2D2F" />
                  <span className="text-xl tracking-tight" style={{ color: '#2D2D2F' }}>
                    <span className="font-bold">SPEAK</span>
                    <span className="font-black">UP</span>
                  </span>
                </div>
                <button
                  onClick={() => setMenuOpen(false)}
                  style={{ color: '#2D2D2F' }}
                  aria-label="Close menu"
                >
                  <XIcon size={28} />
                </button>
              </div>

              <div className="flex-1 flex flex-col items-center justify-center gap-6 px-6">
                {NAV_LINKS.map((l) => (
                  <a
                    key={l}
                    href="#"
                    onClick={() => setMenuOpen(false)}
                    className="text-2xl font-medium"
                    style={{ color: '#2D2D2F' }}
                  >
                    {l}
                  </a>
                ))}
                <a
                  href="#"
                  className="mt-4 rounded-full text-white text-base font-medium px-10 py-4"
                  style={{ backgroundColor: '#2D2D2F' }}
                >
                  Begin a venture
                </a>
              </div>
            </div>
          )}
        </section>
      );
    }

    function App() {
      return (
        <main>
          <Hero />
        </main>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
