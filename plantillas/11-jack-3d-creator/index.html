    // ═════════════════════════ FadeIn ═════════════════════════
    function FadeIn({ children, as = 'div', delay = 0, duration = 0.7, x = 0, y = 30, className, style }) {
      const Tag = motion[as] || motion.div;
      return (
        <Tag
          initial={{ opacity: 0, x, y }}
          whileInView={{ opacity: 1, x: 0, y: 0 }}
          viewport={{ once: true, margin: '50px', amount: 0 }}
          transition={{ duration, delay, ease: [0.25, 0.1, 0.25, 1] }}
          className={className}
          style={style}
        >
          {children}
        </Tag>
      );
    }

    // ═════════════════════════ Magnet ═════════════════════════
    function Magnet({
      children,
      padding = 100,
      strength = 3,
      activeTransition = 'transform 0.3s ease-out',
      inactiveTransition = 'transform 0.6s ease-in-out',
      className,
      style,
    }) {
      const ref = useRef(null);

      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        let active = false;

        const onMove = (e) => {
          const rect = el.getBoundingClientRect();
          const within =
            e.clientX > rect.left - padding && e.clientX < rect.right + padding &&
            e.clientY > rect.top  - padding && e.clientY < rect.bottom + padding;
          if (within) {
            const cx = rect.left + rect.width  / 2;
            const cy = rect.top  + rect.height / 2;
            const dx = (e.clientX - cx) / strength;
            const dy = (e.clientY - cy) / strength;
            el.style.transition = activeTransition;
            el.style.transform  = `translate3d(${dx}px, ${dy}px, 0)`;
            active = true;
          } else if (active) {
            el.style.transition = inactiveTransition;
            el.style.transform  = 'translate3d(0,0,0)';
            active = false;
          }
        };
        window.addEventListener('mousemove', onMove);
        return () => window.removeEventListener('mousemove', onMove);
      }, [padding, strength, activeTransition, inactiveTransition]);

      return (
        <div ref={ref} className={className} style={{ ...style, willChange: 'transform' }}>
          {children}
        </div>
      );
    }

    // ═════════════════════════ AnimatedText (char-by-char) ═════════════════════════
    function Char({ char, start, end, progress }) {
      const opacity = useTransform(progress, [start, end], [0.2, 1]);
      return (
        <span style={{ position: 'relative', display: 'inline-block' }}>
          <span style={{ opacity: 0, visibility: 'hidden' }}>{char === ' ' ? ' ' : char}</span>
          <motion.span style={{ position: 'absolute', top: 0, left: 0, opacity }}>
            {char === ' ' ? ' ' : char}
          </motion.span>
        </span>
      );
    }
    function AnimatedText({ text, className, style }) {
      const ref = useRef(null);
      const { scrollYProgress } = useScroll({
        target: ref,
        offset: ['start 0.8', 'end 0.2'],
      });
      const chars = text.split('');
      const total = chars.length;
      return (
        <p ref={ref} className={className} style={style}>
          {chars.map((c, i) => (
            <Char
              key={i}
              char={c}
              start={(i / total) - 0.1}
              end={(i / total) + 0.05}
              progress={scrollYProgress}
            />
          ))}
        </p>
      );
    }

    // ═════════════════════════ MARQUEE ═════════════════════════
    function MarqueeSection() {
      const sectionRef = useRef(null);
      const [offset, setOffset] = useState(0);

      useEffect(() => {
        const onScroll = () => {
          if (!sectionRef.current) return;
          const rect = sectionRef.current.getBoundingClientRect();
          const sectionTop = window.scrollY + rect.top;
          const calc = (window.scrollY - sectionTop + window.innerHeight) * 0.3;
          setOffset(calc);
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      const row1 = MARQUEE_GIFS.slice(0, 11);
      const row2 = MARQUEE_GIFS.slice(11);
      const r1 = [...row1, ...row1, ...row1];
      const r2 = [...row2, ...row2, ...row2];

      const tileClass =
        'rounded-2xl object-cover flex-shrink-0';
      const tileStyle = { width: 420, height: 270 };

      return (
        <section
          ref={sectionRef}
          className="pt-24 sm:pt-32 md:pt-40 pb-10 overflow-hidden"
          style={{ background: '#0C0C0C' }}
        >
          <div className="flex flex-col gap-3">
            <div
              className="flex gap-3"
              style={{ transform: `translateX(${offset - 200}px)`, willChange: 'transform' }}
            >
              {r1.map((src, i) => (
                <img key={i} src={src} loading="lazy" className={tileClass} style={tileStyle} alt="" />
              ))}
            </div>
            <div
              className="flex gap-3"
              style={{ transform: `translateX(${-(offset - 200)}px)`, willChange: 'transform' }}
            >
              {r2.map((src, i) => (
                <img key={i} src={src} loading="lazy" className={tileClass} style={tileStyle} alt="" />
              ))}
            </div>
          </div>
        </section>
      );

    function ProjectCard({ project, index, totalCards }) {

          >
            <div
              className="absolute inset-0 rounded-[40px] sm:rounded-[50px] md:rounded-[60px] pointer-events-none"
              style={{ borderColor: '#D7E2EA', background: '#0C0C0C', zIndex: -1 }}
            />

            {/* Top row */}
            <div className="flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-4 sm:gap-6 md:gap-8">
                <span
                  className="hero-heading font-black leading-none"
                  style={{ fontSize: 'clamp(3rem, 10vw, 140px)' }}
                >
                  {project.num}
                </span>
                <div className="flex flex-col gap-1 sm:gap-2">
                  <span
                    className="uppercase tracking-widest font-light"
                    style={{ color: '#D7E2EA', opacity: 0.6, fontSize: 'clamp(0.7rem, 1.1vw, 1rem)' }}
                  >
                    {project.category}
                  </span>
                  <h3
                    className="font-medium uppercase leading-tight"
                    style={{ color: '#D7E2EA', fontSize: 'clamp(1rem, 2.2vw, 2.1rem)' }}
                  >
                    {project.name}
                  </h3>
                </div>
              </div>
              <LiveProjectButton />
            </div>

            {/* Bottom row: image grid */}
            <div className="flex gap-3 sm:gap-4 md:gap-5">
              <div className="flex flex-col gap-3 sm:gap-4 md:gap-5" style={{ width: '40%' }}>
                <img
                  src={project.col1a}
                  alt=""
                  className="w-full object-cover rounded-[40px] sm:rounded-[50px] md:rounded-[60px]"
                  style={{ height: 'clamp(130px, 16vw, 230px)' }}
                />
                <img
                  src={project.col1b}
                  alt=""
                  className="w-full object-cover rounded-[40px] sm:rounded-[50px] md:rounded-[60px]"
                  style={{ height: 'clamp(160px, 22vw, 340px)' }}
                />
              </div>
              <div className="flex-1">
                <img
                  src={project.col2}
                  alt=""
                  className="w-full h-full object-cover rounded-[40px] sm:rounded-[50px] md:rounded-[60px]"
                />
              </div>
            </div>
          </motion.div>
        </div>
      );
    }

    function ProjectsSection() {
      return (
        <section
          className="relative z-10 rounded-t-[40px] sm:rounded-t-[50px] md:rounded-t-[60px] -mt-10 sm:-mt-12 md:-mt-14 px-5 sm:px-8 md:px-10 py-20 sm:py-24 md:py-32"
          style={{ background: '#0C0C0C' }}
        >
          <FadeIn y={40} as="h2"
            className="hero-heading font-black uppercase tracking-tight leading-none text-center mb-16 sm:mb-20 md:mb-28"
            style={{ fontSize: 'clamp(3rem, 12vw, 160px)' }}
          >
            Project
          </FadeIn>

          <div className="max-w-7xl mx-auto">
            {PROJECTS.map((p, i) => (
              <ProjectCard key={p.num} project={p} index={i} totalCards={PROJECTS.length} />
            ))}
          </div>
        </section>
      );
    }

    // ═════════════════════════ App ═════════════════════════
    function App() {
      return (
        <main style={{ background: '#0C0C0C', overflowX: 'clip' }}>
          <HeroSection />
          <MarqueeSection />
          <AboutSection />
          <ServicesSection />
          <ProjectsSection />
        </main>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
